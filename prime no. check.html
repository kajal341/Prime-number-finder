<!doctype html>
<html>
<head>
    
    
    <style>
        #main-division{
            height:150px;
            width:200px;
            border: 2px solid black;
            background-color: skyblue;
            margin-left: 30%;
            margin-top: 30px;
           
        }
        #design{
            margin-top: 10px;
            margin-left: 70px;
            border-radius: 10px;
            border:2px solid black;
            height:25px;
            width:50px;
            
        }
        #design:hover{
           color:white;
        
            background-color: blue
        }
        #number{
            margin-top: 30px;
            margin-left: 15px;
        }
    </style>
    </head>
       
  <body>
      <div id="main-division">
          
    <input type="text" placeholder="Enter The Number...." id="number">
    <button id="design" onclick="prime()" onclick="odd()">Check</button>
    <div id="result"></div>
      
      
    
<script>
    
    function prime(){
        var prime=document.getElementById("number").value;
        
        var check=0;
        for(var i=2; i<prime;i++){
            if(prime%i==0)
                {
                    check=check+1;
                }
    }
        
        if(check==0)
            {
                document.getElementById("result").innerHTML="number is prime"
            }
          else{
              document.getElementById("result").innerHTML="number is not prime"
            }
    }
    
    
    </script>
      </div>
    </body>
</html>
